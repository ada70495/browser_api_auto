[pytest]
# 用例目录与命名规则
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 控制台实时打印日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(message)s

# 详细输出 + Allure 原始数据 + 失败重跑 1 次 + 覆盖率统计
addopts = -v -s
          --alluredir=reports/allure_raw
          --clean-alluredir
          --reruns=1
          --reruns-delay=1
          --cov=common
          --cov=page
          --cov=utils
          --cov-report=term-missing

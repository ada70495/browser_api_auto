# 新增浏览历史：标题字段统一用 title_name，避免与用例名 title 冲突
add_history_cases:
  - case_id: history_001
    title: 正常新增B站浏览记录
    title_name: 哔哩哔哩
    url: https://www.bilibili.com
    visit_time: "2026-07-22 12:00:00"
    expect_msg: "记录保存成功"

  - case_id: history_002
    title: 链接为空，新增历史记录失败
    title_name: 空链接
    url: ""
    visit_time: "2026-07-22 12:00:00"
    expect_msg: "链接地址不能为空"

  - case_id: history_003
    title: 访问时间为空，参数校验失败
    title_name: 缺少时间
    url: https://www.bilibili.com
    visit_time: ""
    expect_msg: "访问时间不能为空"

# 指定当前运行环境：local（本地被测服务）/ ci（Jenkins 容器访问宿主机）
env: local

local:
  base_url: "http://127.0.0.1:9200/api/v1"
  timeout: 10

ci:
  base_url: "http://host.docker.internal:9200/api/v1"
  timeout: 15

# 所有接口通用请求头
global_headers:
  Content-Type: "application/json"
  platform: "mobile"
  app_version: "1.0.0"

# 测试账号：本地 Mock 服务固定账号，不是真实凭据
# 真实账号写在本地 .env（TEST_USER / TEST_PWD，已在 .gitignore 排除）
account:
  username: "testuser"
  password: "123456"
  sign_key: "mock-sign-key-2026"
